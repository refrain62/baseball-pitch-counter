<!doctype html>
<html lang="ja">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
>

<meta name="theme-color" content="#080a0d">

<title>Pitch Counter</title>

<style>

/* ================================
   基本
================================ */

:root {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #080a0d;
  color: #ffffff;

  min-height: 100%;
}

body {
  min-height: 100dvh;
  overscroll-behavior: none;
}

button,
input {
  font: inherit;
}


/* ================================
   全体
================================ */

.app {
  max-width: 720px;

  margin: auto;

  padding:
    max(10px, env(safe-area-inset-top))
    10px
    max(16px, env(safe-area-inset-bottom));
}


/* ================================
   ヘッダー
================================ */

header {
  text-align: center;
  margin: 3px 0 10px;
}

h1 {
  margin: 0;

  font-size: 18px;

  letter-spacing: .08em;
}

.hint {
  margin-top: 4px;

  font-size: 13px;

  color: #aab2be;
}


/* ================================
   左右レイアウト
================================ */

.grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;
}

.side {
  min-width: 0;

  padding: 10px;

  background: #141820;

  border:
    1px solid #303743;

  border-radius: 20px;
}


/* ================================
   チーム名
================================ */

.name {
  width: 100%;
  height: 48px;

  padding: 0 5px;

  border:
    1px solid #39424f;

  border-radius: 12px;

  background: #0d1015;

  color: #ffffff;

  text-align: center;

  font-size: 18px;
  font-weight: 700;
}


/* ================================
   投球数
================================ */

.count {
  text-align: center;

  font-variant-numeric:
    tabular-nums;

  font-size:
    clamp(
      86px,
      25vw,
      155px
    );

  font-weight: 900;

  line-height: .95;

  margin:
    24px
    0
    20px;

  transition:
    transform .12s ease;
}


/* ＋1 / 戻す時の反応 */

.count.pulse {
  transform: scale(1.10);
}


/* ================================
   ＋1
================================ */

.plus {
  width: 100%;

  height: 190px;

  border: 0;

  border-radius: 24px;

  background: #f4f5f6;

  color: #080a0d;

  font-size: 52px;

  font-weight: 900;

  box-shadow:
    0 7px 0 #858c96;

  touch-action: manipulation;

  user-select: none;

  cursor: pointer;
}

.plus:active {
  transform: translateY(6px);

  box-shadow:
    0 1px 0 #858c96;

  background: #dfe2e5;
}


/* ================================
   1球戻す
================================ */

.undo {
  width: 100%;

  height: 58px;

  margin-top: 26px;

  border:
    1px solid #46505e;

  border-radius: 15px;

  background: #252b35;

  color: #ffffff;

  font-size: 18px;

  font-weight: 700;

  touch-action: manipulation;

  cursor: pointer;
}

.undo:active {
  background: #343c48;
}


/* ================================
   リセット
================================ */

.sideReset {
  display: block;

  width: 75%;

  height: 40px;

  margin:
    28px
    auto
    4px;

  border:
    1px solid #57343a;

  border-radius: 12px;

  background: transparent;

  color: #b8878d;

  font-size: 13px;

  font-weight: 600;

  touch-action: manipulation;

  cursor: pointer;
}


/* ================================
   保存表示
================================ */

.saved {
  margin-top: 10px;

  text-align: center;

  color: #8993a1;

  font-size: 12px;
}


/* ================================
   リセット確認
================================ */

dialog {
  width:
    min(
      90vw,
      400px
    );

  padding: 22px;

  border:
    1px solid #414957;

  border-radius: 20px;

  background: #151920;

  color: #ffffff;
}

dialog::backdrop {
  background:
    rgba(
      0,
      0,
      0,
      .75
    );
}

dialog h2 {
  margin:
    0
    0
    8px;

  font-size: 22px;
}

dialog p {
  margin:
    0
    0
    20px;

  color: #bdc5cf;

  line-height: 1.5;
}

.dlgBtns {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;
}

.dlgBtns button {
  height: 58px;

  border-radius: 14px;

  font-size: 17px;

  font-weight: 800;
}

.cancel {
  border:
    1px solid #4a5564;

  background: #2a313b;

  color: #ffffff;
}

.confirm {
  border: 0;

  background: #8f2933;

  color: #ffffff;
}


/* ================================
   小さいスマホ
================================ */

@media (max-width: 390px) {

  .app {
    padding-left: 6px;
    padding-right: 6px;
  }

  .grid {
    gap: 6px;
  }

  .side {
    padding: 7px;
  }

  .name {
    font-size: 16px;
  }

  .count {
    font-size:
      clamp(
        74px,
        24vw,
        120px
      );
  }

  .plus {
    height: 170px;

    font-size: 48px;
  }

  .undo {
    height: 56px;

    margin-top: 22px;

    font-size: 16px;
  }

  .sideReset {
    margin-top: 25px;
  }

}

</style>
</head>


<body>


<main class="app">


<!-- ================================
     ヘッダー
================================ -->

<header>

  <h1>
    PITCH COUNTER
  </h1>

  <div class="hint">
    投球ごとに「＋1」
  </div>

</header>



<!-- ================================
     カウンター
================================ -->

<section class="grid">


<!-- ================================
     1塁側
================================ -->

<div class="side">


<input
  id="nameA"
  class="name"
  value="1塁側"
  aria-label="1塁側"
/>


<div
  id="countA"
  class="count"
>
0
</div>


<button
  class="plus"
  data-plus="A"
>
＋1
</button>


<button
  class="undo"
  data-undo="A"
>
↶ 1球戻す
</button>


<button
  class="sideReset"
  data-reset="A"
>
リセット
</button>


</div>



<!-- ================================
     3塁側
================================ -->

<div class="side">


<input
  id="nameB"
  class="name"
  value="3塁側"
  aria-label="3塁側"
/>


<div
  id="countB"
  class="count"
>
0
</div>


<button
  class="plus"
  data-plus="B"
>
＋1
</button>


<button
  class="undo"
  data-undo="B"
>
↶ 1球戻す
</button>


<button
  class="sideReset"
  data-reset="B"
>
リセット
</button>


</div>


</section>


<div class="saved">
自動保存
</div>


</main>



<!-- ================================
     リセット確認
================================ -->

<dialog id="confirmDlg">


<h2>
リセットしますか？
</h2>


<p id="resetMessage">

この投球数を
<strong>0</strong>
にします。

<br>

この操作は元に戻せません。

</p>


<div class="dlgBtns">


<button
  class="cancel"
  id="cancel"
>
キャンセル
</button>


<button
  class="confirm"
  id="confirm"
>
リセットする
</button>


</div>


</dialog>



<script>

/* ================================
   保存キー
================================ */

const KEY =
  "pitch-counter-v4";


/* ================================
   状態
================================ */

let state = {

  A: 0,

  B: 0,

  nameA:
    "1塁側",

  nameB:
    "3塁側"

};


/* ================================
   保存データ読み込み
================================ */

try {

  const saved =
    JSON.parse(
      localStorage.getItem(KEY)
    );


  if (saved) {

    state = {

      ...state,

      ...saved

    };

  }

}
catch (error) {

  console.error(error);

}


/* ================================
   DOM helper
================================ */

const $ =
  id =>
    document.getElementById(id);


/* ================================
   保存
================================ */

function save() {

  localStorage.setItem(

    KEY,

    JSON.stringify(state)

  );

}


/* ================================
   表示更新
================================ */

function render() {

  $("countA").textContent =
    state.A;


  $("countB").textContent =
    state.B;


  $("nameA").value =
    state.nameA;


  $("nameB").value =
    state.nameB;


  save();

}


/* ================================
   バイブ
================================ */

/*
  Android / 対応ブラウザ用。

  iPhone Safariは
  navigator.vibrate() に
  対応していないため、
  iPhoneでは音＋画面反応になります。
*/

function vibrateStrong() {

  if (navigator.vibrate) {

    navigator.vibrate([
      35,
      20,
      35
    ]);

  }

}


function vibrateLight() {

  if (navigator.vibrate) {

    navigator.vibrate(
      20
    );

  }

}


/* ================================
   Audio Context
================================ */

let audioContext =
  null;


function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =

      window.AudioContext
      ||
      window.webkitAudioContext;


    if (!AudioContextClass) {

      return null;

    }


    audioContext =
      new AudioContextClass();

  }


  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();

  }


  return audioContext;

}


/* ================================
   ＋1 クリック音

   強めの「カチッ」
================================ */

function clickSoundStrong() {

  const ctx =
    getAudioContext();


  if (!ctx) {
    return;
  }


  const now =
    ctx.currentTime;


  /*
    高音クリック
  */

  const osc1 =
    ctx.createOscillator();


  const gain1 =
    ctx.createGain();


  osc1.type =
    "square";


  osc1.frequency
    .setValueAtTime(
      1100,
      now
    );


  osc1.frequency
    .exponentialRampToValueAtTime(
      250,
      now + 0.045
    );


  gain1.gain
    .setValueAtTime(
      0.30,
      now
    );


  gain1.gain
    .exponentialRampToValueAtTime(
      0.001,
      now + 0.055
    );


  osc1.connect(
    gain1
  );


  gain1.connect(
    ctx.destination
  );


  osc1.start(now);


  osc1.stop(
    now + 0.06
  );


  /*
    低音を少し重ねる
  */

  const osc2 =
    ctx.createOscillator();


  const gain2 =
    ctx.createGain();


  osc2.type =
    "sine";


  osc2.frequency
    .setValueAtTime(
      180,
      now
    );


  gain2.gain
    .setValueAtTime(
      0.20,
      now
    );


  gain2.gain
    .exponentialRampToValueAtTime(
      0.001,
      now + 0.07
    );


  osc2.connect(
    gain2
  );


  gain2.connect(
    ctx.destination
  );


  osc2.start(now);


  osc2.stop(
    now + 0.075
  );

}


/* ================================
   1球戻す音
================================ */

function clickSoundUndo() {

  const ctx =
    getAudioContext();


  if (!ctx) {
    return;
  }


  const now =
    ctx.currentTime;


  const oscillator =
    ctx.createOscillator();


  const gain =
    ctx.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency
    .setValueAtTime(
      450,
      now
    );


  oscillator.frequency
    .exponentialRampToValueAtTime(
      220,
      now + 0.05
    );


  gain.gain
    .setValueAtTime(
      0.16,
      now
    );


  gain.gain
    .exponentialRampToValueAtTime(
      0.001,
      now + 0.06
    );


  oscillator.connect(
    gain
  );


  gain.connect(
    ctx.destination
  );


  oscillator.start(now);


  oscillator.stop(
    now + 0.065
  );

}


/* ================================
   数字アニメーション
================================ */

function pulseCount(side) {

  const count =
    $("count" + side);


  count.classList.remove(
    "pulse"
  );


  /*
    再描画させて
    連続アニメーション可能にする
  */

  void count.offsetWidth;


  count.classList.add(
    "pulse"
  );


  setTimeout(
    () => {

      count.classList.remove(
        "pulse"
      );

    },

    140

  );

}


/* ================================
   ＋1
================================ */

document
  .querySelectorAll(
    "[data-plus]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {


          const side =
            button.dataset.plus;


          /*
            1球追加
          */

          state[side]++;


          /*
            強めクリック音
          */

          clickSoundStrong();


          /*
            強めバイブ
          */

          vibrateStrong();


          /*
            保存・表示
          */

          render();


          /*
            数字をポン
          */

          pulseCount(side);

        };

    }
  );


/* ================================
   1球戻す
================================ */

document
  .querySelectorAll(
    "[data-undo]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {


          const side =
            button.dataset.undo;


          /*
            0以下にはしない
          */

          if (
            state[side] > 0
          ) {


            state[side]--;


            /*
              ＋1とは違う
              低めの音
            */

            clickSoundUndo();


            /*
              弱いバイブ
            */

            vibrateLight();


            /*
              保存・表示
            */

            render();


            /*
              数字反応
            */

            pulseCount(side);

          }

        };

    }
  );


/* ================================
   チーム名変更
================================ */

[
  "A",
  "B"
]
.forEach(
  side => {

    $("name" + side)
      .onchange =
        event => {


          const value =
            event
              .target
              .value
              .trim();


          state[
            "name" + side
          ] =

            value

            ||

            (
              side === "A"
              ?
              "1塁側"
              :
              "3塁側"
            );


          render();

        };

  }
);


/* ================================
   個別リセット
================================ */

const dialog =
  $("confirmDlg");


let resetTarget =
  null;


document
  .querySelectorAll(
    "[data-reset]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {


          resetTarget =
            button.dataset.reset;


          const name =

            resetTarget === "A"

            ?

            state.nameA

            :

            state.nameB;


          $("resetMessage")
            .innerHTML =

              `「${name}」の投球数を
               <strong>0</strong>
               にします。
               <br>
               この操作は元に戻せません。`;


          dialog.showModal();

        };

    }
  );


/* ================================
   リセットキャンセル
================================ */

$("cancel")
  .onclick =
    () => {

      resetTarget =
        null;


      dialog.close();

    };


/* ================================
   リセット確定
================================ */

$("confirm")
  .onclick =
    () => {


      if (
        resetTarget
      ) {


        state[
          resetTarget
        ] = 0;


        /*
          リセット時
          強めの振動
        */

        vibrateStrong();


        render();

      }


      resetTarget =
        null;


      dialog.close();

    };


/* ================================
   初期表示
================================ */

render();

</script>


</body>

</html>
