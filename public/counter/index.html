<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0d">
<meta name="description" content="野球の投球数を2系統でカウントするシンプルなPWA">
<title>Pitch Counter</title>
<link rel="manifest" href="/counter/manifest.webmanifest">
<link rel="apple-touch-icon" href="/counter/icons/apple-touch-icon.png">
<link rel="icon" href="/counter/icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="/counter/counter.css">
<script src="/counter/counter.js" defer></script>
</head>
<body>
<main class="app">
  <header class="counter-header">
    <a class="back-link" href="/" aria-label="説明ページへ戻る">‹</a>
    <div>
      <h1>PITCH COUNTER</h1>
      <p>投球ごとに大きいボタンをタップ</p>
    </div>
    <button class="install-button" id="installButton" type="button" hidden>このカウンターをホーム画面に追加</button>
  </header>

  <section class="grid" aria-label="投球数カウンター">
    <article class="side side-a">
      <label class="sr-only" for="nameA">左側の名称</label>
      <input id="nameA" class="name" value="1塁側" maxlength="12" autocomplete="off">
      <div id="countA" class="count" aria-live="polite">0</div>
      <button class="plus" type="button" data-plus="A" aria-label="1塁側を1球増やす"><span>＋1</span></button>
      <button class="undo" type="button" data-undo="A">↶ 1球戻す</button>
      <button class="side-reset" type="button" data-reset="A">リセット</button>
    </article>

    <article class="side side-b">
      <label class="sr-only" for="nameB">右側の名称</label>
      <input id="nameB" class="name" value="3塁側" maxlength="12" autocomplete="off">
      <div id="countB" class="count" aria-live="polite">0</div>
      <button class="plus" type="button" data-plus="B" aria-label="3塁側を1球増やす"><span>＋1</span></button>
      <button class="undo" type="button" data-undo="B">↶ 1球戻す</button>
      <button class="side-reset" type="button" data-reset="B">リセット</button>
    </article>
  </section>

  <p class="saved">端末内に自動保存</p>
</main>

<dialog id="resetDialog" class="dialog">
  <h2>リセットしますか？</h2>
  <p><strong id="resetName"></strong> の投球数を <strong>0</strong> にします。<br>この操作は元に戻せません。</p>
  <div class="dialog-actions">
    <button id="cancelReset" class="dialog-cancel" type="button">キャンセル</button>
    <button id="confirmReset" class="dialog-confirm" type="button">リセットする</button>
  </div>
</dialog>

<dialog id="installDialog" class="dialog">
  <h2 id="installTitle">このカウンターをアプリとして使う</h2>
  <p id="installHelp">このカウンターを端末のホーム画面に追加すると、アプリのように起動できます。</p>
  <div class="dialog-actions one">
    <button id="closeInstall" class="dialog-cancel" type="button">閉じる</button>
  </div>
</dialog>
</body>
</html>
